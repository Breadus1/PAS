<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KinoBilet – Twoja rezerwacja</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a href="/">KinoBilet</a></header>
  <main>
    <h1 id="title">Twoja rezerwacja</h1>
    <p id="info">Ładowanie…</p>

    <section id="pending" hidden>
      <p>Trzymamy Twój fotel jeszcze <strong id="timer">--:--</strong></p>
      <button id="buy" class="button">Zapłać</button>
      <p id="error" class="error"></p>
    </section>

    <section id="expired" hidden>
      <p class="error">Rezerwacja wygasła, fotel wrócił do puli.</p>
      <a id="again" href="/">Wybierz fotel jeszcze raz</a>
    </section>

    <section id="ticket" class="ticket" hidden>
      <p>Kod biletu</p>
      <p id="code" class="code"></p>
      <p>Pokaż ten kod przy wejściu na salę.</p>
    </section>
  </main>

  <script src="/common.js"></script>
  <script>
    const reservationId = location.pathname.split('/')[2];
    let reservation;
    let timer;

    function show(sectionId) {
      for (const section of document.querySelectorAll('section')) {
        section.hidden = section.id !== sectionId;
      }
    }

    function tick() {
      const left = new Date(reservation.expiresAt) - Date.now();
      if (left <= 0) {
        clearInterval(timer);
        show('expired');
        return;
      }

      const minutes = Math.floor(left / 60000);
      const seconds = Math.floor(left / 1000) % 60;
      document.getElementById('timer').textContent = `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function showTicket(code) {
      clearInterval(timer);
      document.getElementById('title').textContent = 'Twój bilet';
      document.getElementById('code').textContent = code;
      show('ticket');
    }

    async function load() {
      const res = await fetch(`/api/reservations/${reservationId}`);
      if (!res.ok) {
        document.getElementById('title').textContent = 'Nie ma takiej rezerwacji';
        document.getElementById('info').textContent = '';
        return;
      }
      reservation = await res.json();

      const eventRes = await fetch(`/api/events/${reservation.eventId}`);
      const { event } = await eventRes.json();
      document.getElementById('info').textContent =
        `${event.title} · ${formatDate(event.startsAt)} · ${event.hall} · ${seatLabel(reservation.seatId)}`;
      document.getElementById('again').href = `/events/${event._id}`;

      if (reservation.status === 'purchased') {
        showTicket(reservation.code);
        return;
      }

      show('pending');
      tick();
      timer = setInterval(tick, 1000);
    }

    document.getElementById('buy').onclick = async () => {
      const button = document.getElementById('buy');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';

      const res = await fetch(`/api/reservations/${reservationId}/checkout`, { method: 'POST' });
      const data = await res.json();

      if (res.ok) {
        location.href = data.url;
      } else if (res.status === 410) {
        clearInterval(timer);
        show('expired');
      } else {
        error.textContent = data.error;
        button.disabled = false;
      }
    };

    load();
  </script>
</body>
</html>
