<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KinoBilet – wybór fotela</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a href="/">KinoBilet</a></header>
  <main>
    <a href="/">← Repertuar</a>
    <h1 id="title">Ładowanie…</h1>
    <p id="info"></p>

    <div class="screen">EKRAN</div>
    <div id="seats" class="seats"></div>

    <p class="legend">
      <span class="seat"></span> wolny
      <span class="seat taken"></span> zajęty
    </p>

    <section id="waitlist" hidden>
      <h2>Wszystkie miejsca zajęte</h2>
      <p>Zapisz się na listę oczekujących. Gdy zwolni się miejsce, dostaniesz mail z linkiem do zapłaty.</p>
      <form id="form">
        <label>
          Imię
          <input name="customerName" required>
        </label>
        <label>
          E-mail
          <input name="email" type="email" required>
        </label>
        <button type="submit">Powiadom mnie</button>
        <p id="error" class="error"></p>
      </form>
    </section>
  </main>

  <script src="/common.js"></script>
  <script>
    const eventId = location.pathname.split('/')[2];

    async function load() {
      const res = await fetch(`/api/events/${eventId}`);
      if (!res.ok) {
        document.getElementById('title').textContent = 'Nie ma takiego seansu';
        return;
      }

      const { event, takenSeats, soldOut } = await res.json();
      document.getElementById('waitlist').hidden = !soldOut;
      document.getElementById('title').textContent = event.title;
      document.getElementById('info').textContent =
        `${formatDate(event.startsAt)} · ${event.hall} · ${formatPrice(event.price)} za fotel`;

      const seats = document.getElementById('seats');
      for (const seatId of event.seats) {
        const button = document.createElement('button');
        button.className = 'seat';
        button.textContent = seatId;

        if (takenSeats.includes(seatId)) {
          button.classList.add('taken');
          button.disabled = true;
        } else {
          button.onclick = () => {
            location.href = `/reserve?eventId=${event._id}&seatId=${seatId}`;
          };
        }

        seats.appendChild(button);
      }
    }

    const form = document.getElementById('form');
    form.onsubmit = async (e) => {
      e.preventDefault();
      const button = form.querySelector('button');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';

      const res = await fetch(`/api/events/${eventId}/waitlist`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerName: form.customerName.value, email: form.email.value }),
      });
      const data = await res.json();

      if (res.ok) {
        location.href = `/waitlist/${data.waitlistId}`;
      } else {
        error.textContent = data.error;
        button.disabled = false;
      }
    };

    load();
  </script>
</body>
</html>
